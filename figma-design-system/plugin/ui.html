<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #121212;
      color: #fbfbfb;
      padding: 24px;
      min-width: 260px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .dot {
      width: 10px; height: 10px;
      background: #FF1515;
      border-radius: 2px;
    }
    h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.05em; }
    p { font-size: 12px; color: #a6a6a6; margin-bottom: 20px; line-height: 1.5; }
    button {
      width: 100%;
      padding: 10px 16px;
      background: #121212;
      color: #fbfbfb;
      border: 1px solid #fbfbfb;
      border-radius: 0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: -1px 1px 0px 1px #fbfbfb;
      transition: box-shadow 0.2s ease;
      letter-spacing: 0.03em;
    }
    button:hover {
      box-shadow: -3px 3px 0px 1px #fbfbfb;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status {
      margin-top: 14px;
      font-size: 11px;
      color: #a6a6a6;
      min-height: 16px;
    }
    .status.done { color: #FF1515; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="dot"></div>
    <h1>DS BUILDER</h1>
  </div>
  <p>Creates a "Design System" page with color swatches, typography specimens, spacing scale, and component frames.</p>
  <p>Requires <strong style="color:#fbfbfb">Biryani</strong> font — add it via Figma's Google Fonts panel first.</p>
  <button id="runBtn" onclick="run()">Build Design System</button>
  <div class="status" id="status"></div>

  <script>
    function run() {
      document.getElementById('runBtn').disabled = true;
      document.getElementById('status').textContent = 'Building…';
      parent.postMessage({ pluginMessage: 'run' }, '*');
    }
    window.onmessage = (e) => {
      const msg = e.data.pluginMessage;
      const statusEl = document.getElementById('status');
      if (msg && msg.status) {
        statusEl.textContent = msg.status;
        if (msg.done) {
          statusEl.className = 'status done';
          document.getElementById('runBtn').disabled = false;
          document.getElementById('runBtn').textContent = 'Rebuild';
        }
      }
    };
  </script>
</body>
</html>
